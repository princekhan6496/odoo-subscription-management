[project]
name = "brightloop-subscription-system"
version = "1.0.0"
description = "Subscription management backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.1.6",
  "psycopg[binary]==3.2.5",
  "alembic==1.18.4",
  "pydantic==2.14.0",
  "pydantic-settings==2.14.1",
  "email-validator==2.2.0",
  "PyJWT==2.10.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "qstash==3.4.0",
  "resend==2.50.1",
  "reportlab==4.4.9",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.17.3"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
